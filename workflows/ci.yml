# Put this at .github/workflows/ci.yml in the repository connected to your AI system.
# Step 1: add this file and Sync once (first connect = clone = MINOR, no AI analysis).
# Step 2: in a follow-up commit, DELETE the whole "validate" job below (lines marked),
#         then "Sync now". The pull-diff shows a removed validation/test stage ->
#         the LLM maps it to PIPELINE_VALIDATION_STEP_REMOVED (severity MAJOR / "High").

name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: echo "build step"

  # ▼▼▼ DELETE THIS ENTIRE "validate" JOB IN THE SECOND COMMIT TO TRIGGER MAJOR ▼▼▼
  validate:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: pytest -q
      - name: Model input validation tests
        run: pytest tests/validation -q
      - name: Data quality / schema validation
        run: python scripts/validate_input_schema.py
  # ▲▲▲ DELETE UP TO HERE ▲▲▲
